<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>บริการรับส่งพัสดุ</title>
</head>
<body>
  <h2>ฟอร์มจองบริการรับส่งพัสดุ</h2>
  <form id="bookingForm">
    <input type="text" name="name" placeholder="ชื่อลูกค้า" required><br>
    <input type="text" name="origin" placeholder="ที่อยู่ต้นทาง" required><br>
    <input type="text" name="destination" placeholder="ที่อยู่ปลายทาง" required><br>
    <input type="text" name="maps" placeholder="ลิงก์ Google Maps หรือพิกัด" required><br>
    <button type="submit">ส่งข้อมูล</button>
  </form>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = {
        name: this.name.value,
        origin: this.origin.value,
        destination: this.destination.value,
        maps: this.maps.value
      };

      fetch("https://script.google.com/macros/s/AKfycbyuYKIbdX8kxk5jdjRvGx_E92A-fy58V9aJWpZszpOvCgVsOVMge7QKvx9wrd_eiTU7tA/exec", {
        method: "POST",
        body: JSON.stringify(formData)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success'){
          alert("ส่งข้อมูลสำเร็จ!");
        } else {
          alert("เกิดข้อผิดพลาด: " + data.message);
        }
      })
      .catch(err => alert("Error: " + err));
    });
  </script>
</body>
</html>
