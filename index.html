<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฟอร์มสั่งงานรับ-ส่งของ</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        /* Custom styles */
        body { font-family: 'Sarabun', sans-serif; }
        .map-container { height: 300px; border-radius: 0.5rem; margin-top: 0.5rem; }
        .loader { border-top-color: #3498db; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100">

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-32 w-32"></div>
        <p class="text-white text-lg mt-4 absolute">กำลังส่งข้อมูล...</p>
    </div>

    <div class="container mx-auto p-4 max-w-lg">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold mb-4 text-gray-800">ฟอร์มสั่งงานรับ-ส่งของ</h1>
            <p id="welcome-message" class="text-gray-600 mb-6">กำลังโหลดข้อมูลผู้ใช้...</p>

            <form id="delivery-form">
                <!-- Sender Info -->
                <div class="mb-4">
                    <label for="customerName" class="block text-gray-700 font-bold mb-2">ชื่อ-นามสกุลผู้ส่ง</label>
                    <input type="text" id="customerName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="customerPhone" class="block text-gray-700 font-bold mb-2">เบอร์โทรศัพท์</label>
                    <input type="tel" id="customerPhone" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-6">
                    <label for="parcelDetails" class="block text-gray-700 font-bold mb-2">รายละเอียดพัสดุ</label>
                    <textarea id="parcelDetails" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
                </div>

                <!-- Origin -->
                <div class="bg-gray-50 p-4 rounded-lg mb-6">
                    <h2 class="text-xl font-semibold mb-2 text-blue-600">📍 ข้อมูลต้นทาง</h2>
                    <div class="mb-4">
                        <label for="originAddress" class="block text-gray-700 font-bold mb-2">ที่อยู่ต้นทาง (สำหรับเข้ารับ)</label>
                        <textarea id="originAddress" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required></textarea>
                    </div>
                    <p class="text-gray-600 mb-2">ปักหมุดบนแผนที่ (คลิกบนแผนที่เพื่อเลือก)</p>
                    <div id="originMap" class="map-container"></div>
                </div>

                <!-- Destination -->
                <div class="bg-gray-50 p-4 rounded-lg mb-6">
                    <h2 class="text-xl font-semibold mb-2 text-green-600">🏁 ข้อมูลปลายทาง</h2>
                    <div class="mb-4">
                        <label for="destinationAddress" class="block text-gray-700 font-bold mb-2">ที่อยู่ปลายทาง</label>
                        <textarea id="destinationAddress" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required></textarea>
                    </div>
                    <p class="text-gray-600 mb-2">ปักหมุดบนแผนที่ (คลิกบนแผนที่เพื่อเลือก)</p>
                    <div id="destinationMap" class="map-container"></div>
                </div>

                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg w-full focus:outline-none focus:shadow-outline transition-colors duration-300">
                    ส่งข้อมูล
                </button>
            </form>
        </div>
    </div>

    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // --- CONFIGURATION ---
        const LIFF_ID = "2007906947-zQ0mRjXg"; // ⚠️ แก้ไข LIFF ID ของคุณตรงนี้
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9xWKBIqdODpjok4ojacuZ10CCUena2APcmlU7ZFTrdg0N50fo3YUWq2FvnW-p0fJDvA/exec; // ⚠️ แก้ไข URL ของ Google Apps Script Web App ของคุณตรงนี้

        let originCoords = null;
        let destinationCoords = null;
        let originMarker = null;
        let destinationMarker = null;

        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                document.getElementById('welcome-message').innerText = `สวัสดีคุณ ${profile.displayName}`;
                document.getElementById('customerName').value = profile.displayName;

            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการเปิด LIFF App");
            }
        }

        function initializeMaps() {
            // Default to Bangkok
            const defaultCenter = [13.7563, 100.5018];

            // Initialize Origin Map
            const originMap = L.map('originMap').setView(defaultCenter, 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(originMap);

            originMap.on('click', function(e) {
                originCoords = e.latlng;
                if (originMarker) {
                    originMap.removeLayer(originMarker);
                }
                originMarker = L.marker(originCoords).addTo(originMap)
                    .bindPopup('ตำแหน่งต้นทาง').openPopup();
            });

            // Initialize Destination Map
            const destinationMap = L.map('destinationMap').setView(defaultCenter, 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(destinationMap);

            destinationMap.on('click', function(e) {
                destinationCoords = e.latlng;
                if (destinationMarker) {
                    destinationMap.removeLayer(destinationMarker);
                }
                destinationMarker = L.marker(destinationCoords).addTo(destinationMap)
                    .bindPopup('ตำแหน่งปลายทาง').openPopup();
            });
        }

        document.getElementById('delivery-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            if (!originCoords || !destinationCoords) {
                alert('กรุณาปักหมุดทั้งตำแหน่งต้นทางและปลายทางบนแผนที่');
                return;
            }

            document.getElementById('loading-overlay').classList.remove('hidden');

            const formData = {
                customerName: document.getElementById('customerName').value,
                customerPhone: document.getElementById('customerPhone').value,
                parcelDetails: document.getElementById('parcelDetails').value,
                originAddress: document.getElementById('originAddress').value,
                originLat: originCoords.lat,
                originLng: originCoords.lng,
                destinationAddress: document.getElementById('destinationAddress').value,
                destinationLat: destinationCoords.lat,
                destinationLng: destinationCoords.lng
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Important for Apps Script Web App
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData),
                    redirect: 'follow'
                });
                
                // Since no-cors prevents reading the response, we assume success
                alert('ส่งข้อมูลสำเร็จ! ขอบคุณที่ใช้บริการครับ');
                liff.closeWindow();

            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        });

        // Initialize everything
        main();
        initializeMaps();
    </script>
</body>
</html>
