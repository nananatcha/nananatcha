<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Order Parcel</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- ใส่ Google Maps API ถ้าต้องการปักหมุด -->
</head>
<body>
  <form id="orderForm">
    <input id="name" placeholder="ชื่อ" required />
    <input id="phone" placeholder="เบอร์" required />
    <input id="originAddress" placeholder="ต้นทาง" />
    <input id="destAddress" placeholder="ปลายทาง" />
    <textarea id="parcelDetails" placeholder="รายละเอียด"></textarea>
    <button type="submit">ส่งคำสั่ง</button>
  </form>

<script>
const LIFF_ID = '2007906947-zQ0mRjXg';
let profileInfo = null;

async function initLiff(){
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) liff.login(); // หรือเรียกเมื่อผู้ใช้ยังไม่ login
  profileInfo = await liff.getProfile(); // ดึง userId
  document.getElementById('name').value = profileInfo.displayName || '';
}

async function submitForm(e){
  e.preventDefault();
  const payload = {
    userId: profileInfo.userId,   // สำคัญ: ส่ง userId ไปให้ backend
    customerName: document.getElementById('name').value,
    customerPhone: document.getElementById('phone').value,
    parcelDetails: document.getElementById('parcelDetails').value,
    originAddress: document.getElementById('originAddress').value,
    destinationAddress: document.getElementById('destAddress').value
  };

  // ส่งไป GAS Web App
  const res = await fetch('https://script.google.com/macros/s/AKfycbxIOzC-1qumEHfxdirorkhLjsPTm7iwH8AqiqpKy12QQwKjghnCVCItpoQlEkVW1Yhd-g/exec', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  // อ่านผล (ถ้า CORS อนุญาต)
  const json = await res.json().catch(()=>({status:'ok'}));
  alert('ส่งข้อมูลเรียบร้อย: ' + JSON.stringify(json));
}

window.onload = () => {
  initLiff();
  document.getElementById('orderForm').addEventListener('submit', submitForm);
};
</script>
</body>
</html>
